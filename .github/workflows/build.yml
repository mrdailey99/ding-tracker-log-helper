name: Build Windows helper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m unittest discover -s tests -p test_log_import.py
      - run: python -m unittest discover -s tests -p test_journal_transfer.py
      - run: ./build.ps1
        shell: pwsh
      - name: Smoke test portable executable
        shell: pwsh
        run: |
          $dingVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          python smoke_test.py "dist/DingTracker-LogHelper-$dingVersion-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-helper
          path: dist/*
          if-no-files-found: error

# This workflow produces build artifacts only. Use Publish Windows helper
# to test and publish a versioned GitHub Release manually.
